name: person_plan
description: 'A new Flutter project.'
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter
  # For localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0
  # For flutter bloc
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7
  # For dependency injection
  get_it: ^8.0.3
  # For env files
  flutter_dotenv: ^5.2.1
  # For network calls
  dio: ^5.8.0+1
  # For log management
  logger: ^2.5.0
  # For shared preferences
  shared_preferences: ^2.5.3
  # For device information
  device_info_plus: ^11.3.0
  # For package info
  package_info_plus: ^8.3.0
  go_router: ^14.8.1
  flutter_screenutil: ^5.9.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  flutter_launcher_icons: ^0.14.3

flutter_intl:
  enabled: true

flutter:
  uses-material-design: true
  generate: true
  assets:
    - env/.env.dev
    - env/.env.stg
    - env/.env.prod
    - assets/fonts/
    - assets/images/
    - assets/svgs/
  fonts:
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans/OpenSans-Regular.ttf
        - asset: assets/fonts/OpenSans/OpenSans-Italic.ttf
        - asset: assets/fonts/OpenSans/OpenSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/OpenSans/OpenSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/OpenSans/OpenSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/OpenSans/OpenSans-Light.ttf
          weight: 300
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto/Roboto-Italic.ttf
        - asset: assets/fonts/Roboto/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto/Roboto-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Roboto/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto/Roboto-Light.ttf
          weight: 300
